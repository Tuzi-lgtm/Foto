[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foto"
version = "0.1.0"
description = "Personal Lightroom-style photo library"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "PyOpenGL>=3.1.7",
    "numpy>=1.24",
    "rawpy>=0.21",
    "opencolorio>=2.3",
    "exifread>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10", "tifffile>=2023.1"]

[project.scripts]
foto = "foto.app:main"

[tool.setuptools.packages.find]
include = ["foto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
